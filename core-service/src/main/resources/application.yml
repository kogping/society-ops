spring:
  application:
    name: core-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

societyops:
  dev-users:
    member-password: ${MEMBER_PASSWORD:}
    treasurer-password: ${TREASURER_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
